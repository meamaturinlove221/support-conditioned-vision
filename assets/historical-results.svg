<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="390" viewBox="0 0 1440 390" role="img" aria-labelledby="t d">
<title id="t">Historical Support-Conditioned Vision results</title>
<desc id="d">Historical project records: 98.12 percent on the fixed Difficult set, 97.60 percent on Difficult nail plates, 96.81 percent on cylinder-axis unbalanced NG registration, and a separate 100 percent after supplemental image confirmation.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7faff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
 <style>
 .title{font:700 25px 'Inter','Segoe UI',sans-serif;fill:#132a45}
 .value{font:800 43px 'Inter','Segoe UI',sans-serif;fill:#173d63}
 .label{font:650 17px 'Inter','Segoe UI',sans-serif;fill:#294967}
 .detail{font:500 14px 'Inter','Segoe UI',sans-serif;fill:#60748a}
 .note{font:500 13px 'Inter','Segoe UI',sans-serif;fill:#66798d}
 </style>
</defs>
<rect width="1440" height="390" rx="24" fill="url(#bg)"/>
<text x="48" y="52" class="title">Historical project validation</text>
<text x="48" y="78" class="note">Results recorded in the earlier DINOv2 Support-classification project document; not rerun from this source-only repository snapshot.</text>
<g transform="translate(48 112)">
 <rect width="320" height="205" rx="18" fill="#fff" stroke="#8aa8c9" stroke-width="2"/>
 <text x="26" y="64" class="value">98.12%</text>
 <text x="26" y="102" class="label">Difficult · all products</text>
 <text x="26" y="132" class="detail">8,790 / 8,958</text>
 <text x="26" y="164" class="detail">First fixed-registration result</text>
</g>
<g transform="translate(392 112)">
 <rect width="320" height="205" rx="18" fill="#fff" stroke="#8aa8c9" stroke-width="2"/>
 <text x="26" y="64" class="value">97.60%</text>
 <text x="26" y="102" class="label">Difficult · nail plates</text>
 <text x="26" y="132" class="detail">1,870 / 1,916</text>
 <text x="26" y="164" class="detail">Historical fixed test</text>
</g>
<g transform="translate(736 112)">
 <rect width="320" height="205" rx="18" fill="#fff" stroke="#8aa8c9" stroke-width="2"/>
 <text x="26" y="64" class="value">96.81%</text>
 <text x="26" y="102" class="label">Cylinder · unbalanced NG</text>
 <text x="26" y="132" class="detail">NG Support contains one</text>
 <text x="26" y="153" class="detail">registered abnormal count type</text>
</g>
<g transform="translate(1080 112)">
 <rect width="312" height="205" rx="18" fill="#fff" stroke="#c5a46c" stroke-width="2"/>
 <text x="26" y="64" class="value" style="fill:#8a622b">100%</text>
 <text x="26" y="102" class="label">After supplemental review</text>
 <text x="26" y="132" class="detail">8,958 / 8,958</text>
 <text x="26" y="164" class="detail">Separate follow-up; not the</text>
 <text x="26" y="184" class="detail">original fixed-registration run</text>
</g>
<text x="720" y="360" text-anchor="middle" class="note">Historical results use their original project protocols. Dataset and model artifacts are not included in this public source edition.</text>
</svg>