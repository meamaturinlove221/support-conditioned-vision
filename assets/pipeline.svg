<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-labelledby="title desc">
<title id="title">Support-Conditioned Vision pipeline</title>
<desc id="desc">Support A and B images and Query images are encoded by a frozen DINOv2 ViT-S/14 Register. CLS and ordered Patch features are normalized using balanced Support statistics, then a hard-margin linear classifier is solved and reused for Query prediction.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7faff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
 <style>.h{font:700 25px 'Inter','Segoe UI',sans-serif;fill:#10243e}.s{font:500 16px 'Inter','Segoe UI',sans-serif;fill:#42556d}.k{font:700 18px 'Inter','Segoe UI',sans-serif;fill:#17314f}.small{font:500 14px 'Inter','Segoe UI',sans-serif;fill:#53677f}</style>
</defs>
<rect width="1440" height="430" rx="24" fill="url(#bg)"/>
<text x="52" y="55" class="h">Support-conditioned industrial image classification</text>
<text x="52" y="84" class="s">A/B Support defines the task; the registered readout is reused for every Query image.</text>
<g transform="translate(50 145)">
 <rect width="190" height="200" rx="18" fill="#fff" stroke="#8aa9cb" stroke-width="2"/>
 <text x="95" y="34" text-anchor="middle" class="k">Input images</text>
 <rect x="22" y="58" width="64" height="62" rx="8" fill="#e3edf8" stroke="#8aa9cb"/>
 <rect x="104" y="58" width="64" height="62" rx="8" fill="#e3edf8" stroke="#8aa9cb"/>
 <text x="54" y="96" text-anchor="middle" class="k">A</text><text x="136" y="96" text-anchor="middle" class="k">B</text>
 <rect x="22" y="136" width="146" height="38" rx="8" fill="#f0f4f8" stroke="#c5d1de"/>
 <text x="95" y="161" text-anchor="middle" class="small">Query set</text>
 <text x="95" y="190" text-anchor="middle" class="small">RGB · 448 × 448</text>
</g>
<path d="M250 245 H292" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<g transform="translate(305 145)">
 <rect width="220" height="200" rx="18" fill="#e7f1ff" stroke="#5f8fc5" stroke-width="2"/>
 <text x="110" y="34" text-anchor="middle" class="k">Frozen encoder</text>
 <text x="110" y="72" text-anchor="middle" class="h" style="font-size:22px">DINOv2-S/14</text>
 <text x="110" y="105" text-anchor="middle" class="s">Register backbone</text>
 <rect x="25" y="130" width="170" height="42" rx="8" fill="#fff" stroke="#9bb8d8"/>
 <text x="110" y="157" text-anchor="middle" class="small">FP32 feature extraction</text>
</g>
<path d="M535 245 H577" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<g transform="translate(590 145)">
 <rect width="205" height="200" rx="18" fill="#fff" stroke="#8aa9cb" stroke-width="2"/>
 <text x="102" y="34" text-anchor="middle" class="k">Visual features</text>
 <rect x="18" y="57" width="169" height="42" rx="8" fill="#e9f4ef" stroke="#8cb8a3"/>
 <text x="102" y="84" text-anchor="middle" class="small">CLS · global</text>
 <rect x="18" y="111" width="169" height="42" rx="8" fill="#f2edff" stroke="#ac9bd5"/>
 <text x="102" y="138" text-anchor="middle" class="small">1,024 ordered Patches</text>
 <text x="102" y="181" text-anchor="middle" class="small">384 dimensions each</text>
</g>
<path d="M805 245 H847" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<g transform="translate(860 145)">
 <rect width="205" height="200" rx="18" fill="#fff7e8" stroke="#d8a34e" stroke-width="2"/>
 <text x="102" y="34" text-anchor="middle" class="k">Support statistics</text>
 <text x="102" y="75" text-anchor="middle" class="s">Class-balanced</text>
 <text x="102" y="101" text-anchor="middle" class="s">center + scale</text>
 <rect x="18" y="124" width="169" height="44" rx="8" fill="#fff" stroke="#e2c18a"/>
 <text x="102" y="151" text-anchor="middle" class="small">A = 0.5 · B = 0.5</text>
</g>
<path d="M1075 245 H1117" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<g transform="translate(1130 145)">
 <rect width="255" height="200" rx="18" fill="#eaf7f3" stroke="#68a993" stroke-width="2"/>
 <text x="127" y="34" text-anchor="middle" class="k">Registered readout</text>
 <text x="127" y="75" text-anchor="middle" class="h" style="font-size:22px">Hard-margin classifier</text>
 <text x="127" y="105" text-anchor="middle" class="s">FP64 · free intercept</text>
 <rect x="22" y="128" width="211" height="42" rx="8" fill="#fff" stroke="#9bcbb9"/>
 <text x="127" y="155" text-anchor="middle" class="small">A / B Query scores</text>
</g>
<text x="720" y="390" text-anchor="middle" class="small">Support-derived normalization and classifier parameters remain fixed for the Query batch</text>
</svg>