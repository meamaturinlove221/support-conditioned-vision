<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" role="img" aria-labelledby="t d">
<title id="t">Support-balanced hard-margin QP formulation</title>
<desc id="d">Each A and B Support class contributes total weight one half. The linear readout minimizes half the squared L2 norm of w subject to each labelled Support having margin at least one.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7faff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
 <style>
 .h{font:700 27px 'Inter','Segoe UI',sans-serif;fill:#132a45}
 .k{font:700 19px 'Inter','Segoe UI',sans-serif;fill:#1b3a5c}
 .formula{font:600 30px 'Cambria Math','STIX Two Math','Segoe UI Symbol',serif;fill:#122f50}
 .sub{font:500 16px 'Inter','Segoe UI',sans-serif;fill:#526981}
 .pill{font:600 15px 'Inter','Segoe UI',sans-serif;fill:#315675}
 </style>
</defs>
<rect width="1440" height="470" rx="26" fill="url(#bg)"/>
<text x="54" y="58" class="h">Support-balanced registration and hard-margin QP</text>
<text x="54" y="88" class="sub">The registered Support set determines the normalization and the linear decision boundary.</text>
<rect x="50" y="125" width="390" height="270" rx="20" fill="#ffffff" stroke="#9bb8d7" stroke-width="2"/>
<text x="82" y="168" class="k">1 · Class-balanced weights</text>
<rect x="82" y="193" width="145" height="76" rx="12" fill="#e8f1ff" stroke="#8db0d7"/>
<text x="154" y="222" text-anchor="middle" class="pill">A Support</text>
<text x="154" y="250" text-anchor="middle" class="formula" style="font-size:24px">1 / (2 K_A)</text>
<rect x="250" y="193" width="145" height="76" rx="12" fill="#eaf6f0" stroke="#91bca7"/>
<text x="322" y="222" text-anchor="middle" class="pill">B Support</text>
<text x="322" y="250" text-anchor="middle" class="formula" style="font-size:24px">1 / (2 K_B)</text>
<text x="245" y="306" text-anchor="middle" class="formula" style="font-size:22px">Σᵢ∈A αᵢ = 0.5</text>
<text x="245" y="337" text-anchor="middle" class="formula" style="font-size:22px">Σᵢ∈B αᵢ = 0.5</text>
<text x="245" y="372" text-anchor="middle" class="sub">Equal total contribution per class</text>
<rect x="465" y="125" width="925" height="270" rx="20" fill="#ffffff" stroke="#8aa8c9" stroke-width="2"/>
<text x="500" y="168" class="k">2 · Hard-margin linear QP</text>
<text x="927" y="239" text-anchor="middle" class="formula" style="font-size:36px">minimize     ½ ‖w‖²₂</text>
<line x1="560" y1="270" x2="1295" y2="270" stroke="#d5e0ec" stroke-width="2"/>
<text x="927" y="322" text-anchor="middle" class="formula" style="font-size:32px">subject to     yᵢ (wᵀ zᵢ + b) ≥ 1</text>
<rect x="500" y="350" width="260" height="30" rx="15" fill="#edf4fb"/>
<text x="630" y="371" text-anchor="middle" class="pill">b: unregularized intercept</text>
<rect x="775" y="350" width="260" height="30" rx="15" fill="#edf4fb"/>
<text x="905" y="371" text-anchor="middle" class="pill">zᵢ: normalized CLS + Patch</text>
<rect x="1050" y="350" width="300" height="30" rx="15" fill="#edf4fb"/>
<text x="1200" y="371" text-anchor="middle" class="pill">FP64 optimization and readout</text>
<text x="720" y="440" text-anchor="middle" class="sub">Support statistics are fixed after registration; the same normalization and readout are reused for Query images.</text>
</svg>